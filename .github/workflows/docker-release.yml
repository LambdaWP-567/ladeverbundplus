name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip testing phase'
        required: false
        default: 'false'
        type: boolean
      release_version:
        description: 'Manual release version (e.g. 1.3.0)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Test Suite
    if: github.event.inputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-playwright pytest-html requests
          playwright install chromium
          sudo playwright install-deps chromium

      - name: Create data directory
        run: mkdir -p data

      - name: Run All Tests
        run: |
          PYTHONPATH=. pytest tests/ --html=report.html --self-contained-html

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: report.html

  build-and-push:
    name: Build and Push Docker Image
    needs: [test]
    # Run if test passed OR if tests were skipped
    # Ensure we don't push on PRs
    if: |
      always() &&
      (needs.test.result == 'success' || github.event.inputs.skip_tests == 'true') &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            ${{ github.event.inputs.release_version != '' && format('type=raw,value=v{0}', github.event.inputs.release_version) || '' }}
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_version != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_version != '' && format('v{0}', github.event.inputs.release_version) || github.ref_name }}
          generate_release_notes: true
